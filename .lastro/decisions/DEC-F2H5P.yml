text: "Postgres is the source of truth; git receives a deterministic .lastro/ export."
reason: "One server holds every project of a workspace, with the spec and the run history together and fast queries in the dashboard. `lastro export` keeps the spec reviewed in the same pull request as the code and allows an offline gate in CI; `lastro import` loads a snapshot back."
