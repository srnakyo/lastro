text: "TypeScript 6 for the whole repository: typescript-eslint does not support TypeScript 7 yet."
reason: Lint runs in the global flow of every requirement; a compiler version the linter cannot parse would leave the gate without its lint stage. Revisit when typescript-eslint supports TypeScript 7.
