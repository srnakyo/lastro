id: REQ-P0V3Y
title: "`lastro docs build` generates documentation from data with commit and date"
type: behavior
status: specified
package: PKG-D4S8H
sources:
  - ref: SRC-P4RD7
    anchor: "@03-dashboard.md#documentação-gerada"
    quote: "Todo documento diz de qual commit e de qual data foi gerado."
statement: >
  `lastro docs build` generates the project documents (overview, requirements, business rules and invariants, decisions, client report, diagrams) in Markdown and HTML from the stored data. Every document states the commit and date it was generated from. Test plan and quality report join in stage 3.
where: "lastro docs build"
examples:
  - given: "lastro docs build --format md --out docs/lastro on this repository"
    expect: "docs/lastro/ has requirements.md listing 15 + 8 requirements and decisions.md listing every DEC, each starting with the commit hash and date"
acceptance:
  - id: AC-1
    text: "Given this repository, when `lastro docs build --format md` runs, then each generated document starts with the commit hash and generation date, and requirements.md lists every requirement grouped by package."
    tests: []
decisions: []
questions: []
depends_on: []
touches: []
