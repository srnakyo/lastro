id: REQ-P0V3Y
title: "`lastro docs build` generates documentation from data with commit and date"
type: behavior
status: approved
package: PKG-D4S8H
sources:
  - ref: SRC-P4RD7
    anchor: "@03-dashboard.md#documentação-gerada"
    quote: Todo documento diz de qual commit e de qual data foi gerado.
statement: |
  `lastro docs build` and the button on the Documentation page generate the project documents (overview, requirements, business rules and invariants, decisions, test plan, test cases, quality report, delivery history, client report, diagrams) in Markdown, HTML and PDF from the server data. Every document states the commit and date it was generated from, and each build is recorded as a DocBuild.
where: lastro docs build, Dashboard › Documentation
examples:
  - given: lastro docs build --format md --out docs/lastro on this repository
    expect: docs/lastro/ has requirements.md listing every requirement grouped by package and decisions.md listing every DEC, each starting with the commit hash and date
acceptance:
  - id: AC-1
    text: Given this repository, when `lastro docs build --format md` runs, then each generated document starts with the commit hash and generation date, requirements.md lists every requirement grouped by package, and the server has a DocBuild record for the build.
    tests:
      - tests/integration/docs.test.ts::starts every document with the commit and the date, and groups requirements by package (REQ-P0V3Y)
