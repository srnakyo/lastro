id: REQ-2K9DM
title: Short random IDs with type prefixes
type: format
status: specified
package: PKG-M7V0P
sources:
  - ref: SRC-P4RD7
    anchor: "@04-domain-model.md#ids"
    quote: Aleatório para não colidir quando dois branches criam itens ao mesmo tempo.
statement: |
  New entities get IDs of the form <PREFIX>-<5 Crockford base32 characters>, with the prefixes SRC, REQ, DEC, Q, INC, PKG, ART and INV. The short ID is the public key, unique within the project; the database primary key is a uuid(7). The requester's numbering is never used as ID; it stays in the source anchor label.
examples:
  - given: 10,000 new requirement IDs generated
    expect: all match ^REQ-[0-9A-HJKMNP-TV-Z]{5}$ and none repeats an existing ID of the project
  - given: requirement created from 'item 14' of a document
    expect: ID is random; sources[0].label is 'item 14'
acceptance:
  - id: AC-1
    text: Given 10,000 generated requirement IDs, then every ID matches ^REQ-[0-9A-HJKMNP-TV-Z]{5}$ and no ID collides with an existing requirement of the project.
    tests:
      - tests/unit/codes.test.ts::are INV-XXXXX like every other entity, and older INV-1 codes stay valid
      - tests/unit/codes.test.ts::generates Crockford base32 codes that the schema accepts
      - tests/unit/codes.test.ts::gives up after repeated collisions
