id: REQ-F7H2Q
title: Prisma migrations create the whole schema on Postgres, with an append-only audit table
type: storage
status: specified
package: PKG-D4S8H
sources:
  - ref: SRC-P4RD7
    anchor: "@04-domain-model.md#tabelas-principais"
    quote: As migrações são versionadas e rodam no serviço `migrate` do compose antes do `web`.
  - ref: SRC-P4RD7
    anchor: "@04-domain-model.md#tabelas-principais"
    quote: "`AuditEvent` é só de inclusão: um trigger no Postgres recusa alteração e exclusão."
statement: |
  packages/database holds the Prisma 7 schema and the versioned migrations. Applied to an empty Postgres 16 database, they create every model of the data model with uuid(7) primary keys, a projectId on every project-scoped table, and a trigger that makes AuditEvent append-only. The same migrations run in the compose migrate service before web starts and in the test preload against lastro_test.
where: packages/database, compose migrate service
examples:
  - given: empty lastro_test database, prisma migrate deploy
    expect: every model exists (Workspace through DocBuild) and migrate status reports the schema up to date
  - given: an AuditEvent row, then UPDATE or DELETE on it
    expect: the statement fails with the trigger's error and the row is unchanged
acceptance:
  - id: AC-1
    text: Given an empty lastro_test database, when the migrations are applied, then every model listed in the PRD's main tables exists, every project-scoped table has a projectId column and migrate status reports no pending migration.
    tests:
      - tests/integration/projects.test.ts::has a projectId on every project-scoped table, filled on rows created through nested writes
      - tests/integration/projects.test.ts::reports no pending migration
  - id: AC-2
    text: Given an existing AuditEvent row, when an UPDATE or a DELETE targets it, then the database refuses the statement and the row is unchanged.
    tests:
      - tests/integration/projects.test.ts::never lets the audit log be edited or deleted
decisions:
  - DEC-EPP25
  - DEC-F2H5P
questions: []
depends_on: []
touches: []
