id: REQ-8X1MF
title: Stages run once per required condition
type: behavior
status: approved
package: PKG-M7V0P
sources:
  - ref: SRC-P4RD7
    anchor: "@05-lifecycle-and-gates.md#tipos-de-etapa"
    quote: Roda o comando uma vez por condição, com o `env` e o `setup` dela.
statement: |
  A stage with conditions runs its command once per condition, after that condition's setup, with that condition's env merged into the project environment. Each run is stored as separate evidence tagged with the condition.
where: lastro verify
examples:
  - given: stage e2e with conditions [dark-theme, zoom-125]
    expect: 2 runs, 2 evidence records tagged dark-theme and zoom-125
  - given: setup of one condition fails
    expect: that condition is recorded as failed with the setup output; the other still runs
acceptance:
  - id: AC-1
    text: Given a stage with two conditions, when `lastro verify` runs, then there are two evidence records, each with its condition, env and result.
    tests:
      - tests/integration/runs.test.ts::stores each condition's run with its env and result
      - tests/unit/runner.test.ts::runs each command once per condition, with the condition's env, and reads its report
    locked: sha256:5bbe31b626e49e4c8ee463c5b9525179e39ffc740882bf80f8898638e043f584
  - id: AC-2
    text: Given a condition whose setup exits with a non-zero code, then its evidence is failed with the setup output and the other condition still runs.
    tests:
      - tests/unit/runner.test.ts::fails a condition whose setup fails, keeps its output, and still runs the other condition (REQ-8X1MF)
    locked: sha256:b755a432ffab79b7b2c6f40a6c8ef3a92ccdc5026f16f45b4a1aab45952caa87
