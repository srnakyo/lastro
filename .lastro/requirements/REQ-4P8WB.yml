id: REQ-4P8WB
title: "Quotes must exist literally in the source"
type: behavior
status: specified
package: PKG-M7V0P
sources:
  - ref: SRC-P4RD7
    anchor: "@05-lifecycle-and-gates.md#captured--specified"
    quote: "Citação inventada é recusada."
statement: >
  Every sources[].quote of a requirement must appear literally (ignoring Markdown emphasis markers and repeated whitespace) in the extracted text of the referenced source at the given anchor. A quote that does not match blocks the move to specified and is reported with the closest passage found.
where: "lastro req edit, lastro pending"
examples:
  - given: "quote copied from the source with a line break in a different place"
    expect: "accepted"
  - given: "quote with one word changed"
    expect: "rejected; report shows the closest passage at the anchor"
acceptance:
  - id: AC-1
    text: "Given a quote that differs from the source by one word, when the requirement is evaluated, then it stays captured and the report shows the closest passage at that anchor."
    tests: []
  - id: AC-2
    text: "Given a quote that differs only by line breaks or ** markers, when the requirement is evaluated, then the quote is accepted."
    tests: []
decisions: []
questions: []
depends_on: []
touches: []
