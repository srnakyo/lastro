statement: |
  The Runs page shows trigger, commit, branch, stages by condition, command, output, duration, exit code and artifacts of each run, and compares it with the previous run of the same requirement: newly failing and newly passing tests.
where: Dashboard › Runs
examples:
  - given: run 2 where test X now fails and test Y now passes compared with run 1
    expect: run 2 lists X under 'started failing' and Y under 'passing again'
acceptance:
  - id: AC-1
    text: Given two consecutive runs of a requirement, when the second is opened, then tests that changed from pass to fail and from fail to pass are listed separately.
    tests:
      - tests/e2e/runs.spec.ts::a run says which tests passed again since the previous run, and links to it (REQ-S9A2B)
      - tests/integration/runs.test.ts::lists the tests that started failing and those passing again in separate lists (REQ-S9A2B)
