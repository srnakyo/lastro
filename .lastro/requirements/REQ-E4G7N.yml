id: REQ-E4G7N
title: "Human commands require a person: refused for agents in the core, confirmed on the terminal"
type: behavior
status: specified
package: PKG-M7V0P
sources:
  - ref: SRC-P4RD7
    anchor: "@06-enforcement.md#comandos-humanos"
    quote: pedem confirmação interativa no terminal
  - ref: SRC-P4RD7
    anchor: "@06-enforcement.md#comandos-humanos"
    quote: são recusadas pelo núcleo quando quem pede é um agente
statement: |
  The human-only operations (approve, accept, unlock, drop, decision confirm/overturn, answer, incident triage, source final, manual check and preview) are refused by the core services when the actor is an agent, whether the request comes from the dashboard, the API, the CLI or the MCP. On the CLI they also ask for interactive confirmation on a TTY and refuse to run without one, unless --yes is given by an identity listed in gate.human_identities.
where: lastro approve, lastro accept, lastro unlock, lastro drop, lastro decision, lastro answer, lastro incident triage, lastro source final, lastro check --manual, core services
examples:
  - given: lastro approve run without a TTY and without --yes
    expect: refused; exit code 2
  - given: lastro approve on a TTY, user confirms
    expect: requirement approved and criteria locked
  - given: an agent token calling the approve endpoint of the API
    expect: refused by the core; the requirement stays specified and an audit event records the refusal
acceptance:
  - id: AC-1
    text: Given no TTY and no --yes, when `lastro approve` runs, then it refuses with exit code 2 and changes nothing.
    tests:
      - tests/integration/cli.test.ts::accepts --yes only from a person listed in gate.human_identities
      - tests/integration/cli.test.ts::refuses with exit code 2 and changes nothing when there is no terminal and no --yes
  - id: AC-2
    text: Given an agent actor, when any human-only operation is requested through the API, the CLI or the MCP, then the core refuses it and nothing changes.
    tests:
      - tests/integration/api.test.ts::initializes and lists the tools without any human-only action
      - tests/integration/api.test.ts::lets an agent create requirements but never approve them
      - "tests/integration/lifecycle.test.ts::is a human command: agents can neither approve nor mark sources final"
      - tests/unit/hooks.test.ts::refuses human commands in Bash and lets the rest through
decisions: []
questions: []
depends_on: []
touches: []
