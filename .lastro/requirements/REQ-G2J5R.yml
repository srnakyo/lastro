id: REQ-G2J5R
title: Database URL and tokens come only from environment variables, and tokens are stored hashed
type: storage
status: approved
package: PKG-D4S8H
sources:
  - ref: SRC-P4RD7
    anchor: "@09-architecture-roadmap.md#segurança-e-privacidade"
    quote: a URL do banco e o token ficam em variáveis de ambiente, nunca no `lastro.yml`
  - ref: SRC-P4RD7
    anchor: "@09-architecture-roadmap.md#segurança-e-privacidade"
    quote: ficam guardados como hash SHA-256, com um prefixo visível para reconhecer
statement: |
  The server reads LASTRO_DATABASE_URL from its own environment; in lastro.yml, server.url_env and server.token_env only name environment variables. `lastro doctor` fails when lastro.yml contains a literal URL with credentials or a token, and no command or page ever prints the database password or a token after its creation. API and MCP tokens are stored only as SHA-256 hashes next to a visible prefix.
where: lastro.yml, lastro doctor, Dashboard › Settings › Tokens
examples:
  - given: "lastro.yml with server.token: lst_abc..."
    expect: "doctor fails: 'the token must come from server.token_env'"
  - given: LASTRO_DATABASE_URL set on the server and a connection error
    expect: the error shows host and database, never the password
  - given: a token created in the dashboard
    expect: the value is shown once; the ApiToken row has the prefix and a SHA-256 hash, never the value
acceptance:
  - id: AC-1
    text: Given a lastro.yml with a literal token or a database URL with credentials, when `lastro doctor` runs, then it exits with code 1 and tells to use the *_env setting.
    tests:
      - tests/integration/cli.test.ts::fails on a literal token or database URL with credentials in lastro.yml
    locked: sha256:7aa17f128c646f113ea04b666bbde20b974ebeeb95de167fa6135621ef1baa1d
    locked_at: 2026-11-27T04:23:24.954Z
  - id: AC-2
    text: Given a connection error, when any command or the server reports it, then the message contains no password.
    tests:
      - tests/unit/text.test.ts::removes the password of a connection URL, tokens and password settings from a message
    locked: sha256:3a59c42d80f5a2860d2de084043f7f1bd9438a1cbde4a170e6d53bc12d16f84a
    locked_at: 2026-11-27T04:23:24.954Z
  - id: AC-3
    text: Given a newly created API token, then the database stores only its visible prefix and its SHA-256 hash, and a request with that token authenticates while a request with any other value does not.
    tests:
      - tests/integration/api.test.ts::stores only the visible prefix and a SHA-256 hash; the token authenticates and any other value does not
    locked: sha256:1c447912b3dfd30888cfa82fdf1aac91e3a0a2e9132583bf4b54edf1c2337d8e
    locked_at: 2026-11-27T04:23:24.955Z
