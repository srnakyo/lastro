id: REQ-B5D8J
title: "Evidence goes stale when a touched file changes"
type: behavior
status: specified
package: PKG-M7V0P
sources:
  - ref: SRC-P4RD7
    anchor: "@05-lifecycle-and-gates.md#building--verified-o-gate"
    quote: "o requisito volta a `building` com o motivo"
statement: >
  Evidence is bound to the tree hash of the files in touches. When any of them changes after verification, the requirement returns to building with the reason 'stale evidence' and its gate is red until re-verified.
where: "lastro gate, lastro verify"
examples:
  - given: "verified requirement, then one line changes in a touched file"
    expect: "status building, reason 'stale evidence'"
  - given: "change only in a file outside touches"
    expect: "status stays verified"
acceptance:
  - id: AC-1
    text: "Given a verified requirement, when a file listed in touches changes and the gate runs, then the requirement is building with the reason 'stale evidence'."
    tests: []
  - id: AC-2
    text: "Given a change only in files outside touches, then the requirement stays verified."
    tests: []
decisions: []
questions: []
depends_on: []
touches: []
