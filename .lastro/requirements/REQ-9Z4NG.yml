id: REQ-9Z4NG
title: Read JUnit XML and SARIF results
type: format
status: approved
package: PKG-M7V0P
sources:
  - ref: SRC-P4RD7
    anchor: "@08-integrations.md#executores-de-teste-e-análise"
    quote: ele roda o comando do projeto e lê formatos padrão
statement: |
  The runner parses JUnit XML (bun test, Vitest, Jest, Playwright, pytest, PHPUnit, gotestsum) and SARIF 2.1.0 reports declared under commands.<name>.report, and links test cases to acceptance criteria by 'file::test name'.
examples:
  - given: JUnit file from Vitest with 3 passed and 1 failed case
    expect: results passed 3, failed 1; the failed case is linked to its criterion
  - given: SARIF with 2 errors and 5 warnings
    expect: stage fails on errors; warnings counted
acceptance:
  - id: AC-1
    text: Given JUnit reports produced by Vitest, Jest, Playwright, pytest and PHPUnit, when parsed, then each test case is identified as 'file::test name' with its status.
    tests:
      - tests/unit/runner.test.ts::reads Vitest, Jest, Playwright, pytest and PHPUnit reports as file::test name
    locked: sha256:eb4a2e44363105ee4ae9f497b13b711153c481fd69bf12b1226f763a6044002c
  - id: AC-2
    text: Given a SARIF 2.1.0 report with errors, when the stage is evaluated, then it fails and lists file, line and rule for each error.
    tests:
      - tests/unit/runner.test.ts::fails a stage with SARIF errors and keeps file, line and rule of each
    locked: sha256:d10f870db5a72b76305c8bd7c3caa0b1a254a56cc41360ec0c35f29f6502e806
