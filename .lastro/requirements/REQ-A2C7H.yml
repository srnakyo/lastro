id: REQ-A2C7H
title: "`lastro gate` evaluates the gate on the current commit"
type: behavior
status: specified
package: PKG-M7V0P
sources:
  - ref: SRC-P4RD7
    anchor: "@07-interfaces.md#verificação-e-entrega"
    quote: "Sai com código 0 só se passar."
  - ref: SRC-P4RD7
    anchor: "@04-domain-model.md#exportação-e-importação"
    quote: "Sem servidor, o CI roda o gate offline: lê os critérios travados do `.lastro/` e executa as etapas ali mesmo."
statement: >
  `lastro gate` applies the seven gate rules of the PRD to the selected requirements on the current commit and exits 0 only when all pass. The output separates what the agent can fix from what needs a person. With a server, the gate reads criteria and evidence from it; without one, `lastro gate --ci` reads the locked criteria from the .lastro/ export and runs the stages locally.
where: "lastro gate"
examples:
  - given: "one acceptance criterion without a linked test"
    expect: "exit 1; 'AC-2 has no test' listed under 'agent can fix'"
  - given: "all automatic stages pass, manual preview not signed"
    expect: "exit 1; 'preview not approved' listed under 'needs a person'"
acceptance:
  - id: AC-1
    text: "Given a requirement whose criterion AC-2 has no linked test, when `lastro gate` runs, then it exits with code 1 and lists AC-2 under what the agent can fix."
    tests: []
  - id: AC-2
    text: "Given a requirement whose only missing stage is a manual preview, then the gate exits with code 1 and lists the preview under what needs a person."
    tests: []
  - id: AC-3
    text: "Given a repository with a .lastro/ export and no server configured, when `lastro gate --ci` runs, then it evaluates the locked criteria from the export with runs it performs itself and exits 0 only if they pass."
    tests: []
decisions: []
questions: []
depends_on: []
touches: []
