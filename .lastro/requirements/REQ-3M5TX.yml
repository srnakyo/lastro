id: REQ-3M5TX
title: Required fields per type gate the move to specified
type: behavior
status: specified
package: PKG-M7V0P
sources:
  - ref: SRC-P4RD7
    anchor: "@05-lifecycle-and-gates.md#captured--specified"
    quote: Todos os campos obrigatórios do tipo estão preenchidos.
statement: |
  A requirement moves from captured to specified only when every field listed under types.<type>.required in lastro.yml is filled, besides the base fields. Otherwise it stays captured and `lastro pending` lists the missing fields.
where: lastro req edit, lastro pending
examples:
  - given: type calculation without data_source and period
    expect: "stays captured; pending shows 'missing: data_source, period'"
  - given: type calculation with all required fields, anchored quote, no blocking question
    expect: moves to specified
acceptance:
  - id: AC-1
    text: Given a calculation requirement missing data_source and period, when it is evaluated, then its status stays captured and `lastro pending` lists exactly data_source and period as missing.
    tests:
      - tests/integration/cli.test.ts::lists the missing fields by name, grouped by reason (REQ-3M5TX, REQ-7V6KE)
      - tests/unit/lifecycle.test.ts::lists the required fields that are missing
  - id: AC-2
    text: Given the same requirement with every required field filled, a valid quote and no blocking question, when it is evaluated, then its status becomes specified.
    tests:
      - tests/integration/requirements.test.ts::becomes specified when every required field and quote is in place
decisions: []
questions: []
depends_on: []
touches: []
