id: REQ-6T3JD
title: "Agent assumptions are recorded as proposed decisions"
type: behavior
status: specified
package: PKG-M7V0P
sources:
  - ref: SRC-P4RD7
    anchor: "@03-domain-model.md#decisão-decisionsdec-xxxxxyml"
    quote: "Suposição do agente nasce `proposed` e não trava o item."
statement: >
  A decision recorded by the agent is created with decided_by: agent and status: proposed and does not block its requirement. Only a person can confirm or overturn it; overturning moves verified or later requirements back to building.
where: "lastro decide, lastro decision confirm, lastro decision overturn"
examples:
  - given: "agent records an assumption on a building requirement"
    expect: "DEC with decided_by agent, status proposed; requirement stays building"
  - given: "dev overturns a decision linked to a verified requirement"
    expect: "requirement goes back to building with reason 'decision overturned'"
acceptance:
  - id: AC-1
    text: "Given a verified requirement with a proposed decision, when a person runs `lastro decision overturn`, then the requirement returns to building with the reason 'decision overturned'."
    tests: []
decisions: []
questions: []
depends_on: []
touches: []
