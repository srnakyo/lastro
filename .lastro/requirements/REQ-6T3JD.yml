id: REQ-6T3JD
title: Agent assumptions are recorded as proposed decisions
type: behavior
status: approved
package: PKG-M7V0P
sources:
  - ref: SRC-P4RD7
    anchor: "@04-domain-model.md#decisão-decisionsdec-xxxxxyml"
    quote: Suposição do agente nasce `proposed` e não trava o item.
statement: |
  A decision recorded by the agent is created with decided_by: agent and status: proposed and does not block its requirement. Only a person can confirm or overturn it, and the core refuses both for an agent actor; overturning moves verified or later requirements back to building.
where: lastro decide, lastro decision confirm, lastro decision overturn
examples:
  - given: agent records an assumption on a building requirement
    expect: DEC with decided_by agent, status proposed; requirement stays building
  - given: dev overturns a decision linked to a verified requirement
    expect: requirement goes back to building with reason 'decision overturned'
acceptance:
  - id: AC-1
    text: Given a verified requirement with a proposed decision, when a person runs `lastro decision overturn`, then the requirement returns to building with the reason 'decision overturned'.
    tests:
      - tests/integration/decisions.test.ts::records agent assumptions as proposed and reopens what was built on an overturned one
    locked: sha256:a441149a632568b4819126c99b1c9239b12863ca86e37587a643bf27dc160082
    locked_at: 2026-11-27T04:23:24.885Z
