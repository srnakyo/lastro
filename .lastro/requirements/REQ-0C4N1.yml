id: REQ-0C4N1
title: "`lastro init` creates the .lastro/ structure"
type: behavior
status: specified
package: PKG-M7V0P
sources:
  - ref: SRC-P4RD7
    anchor: "@07-interfaces.md#projeto"
    quote: "Cria `.lastro/` com `lastro.yml`, glossário e contrato de layout vazios, e o `.gitignore` das pastas locais"
statement: >
  `lastro init` creates .lastro/ with lastro.yml, glossary.yml and design.yml, the folders for each entity, and adds .state/, .store/ and .out/ to .gitignore. Running it again never overwrites existing files.
where: "lastro init"
examples:
  - given: "empty git repository"
    expect: "creates lastro.yml, glossary.yml, design.yml, the entity folders and 3 .gitignore lines; exit code 0"
  - given: "repository that already has .lastro/lastro.yml"
    expect: "changes no existing file and reports 'already initialized'; exit code 0"
acceptance:
  - id: AC-1
    text: "Given an empty git repository, when `lastro init` runs, then .lastro/ contains lastro.yml, glossary.yml, design.yml and the folders sources/, requirements/, decisions/, questions/, incidents/, packages/, ledger/, and .gitignore ignores .lastro/.state/, .lastro/.store/ and .lastro/.out/."
    tests: []
  - id: AC-2
    text: "Given a repository with an existing .lastro/lastro.yml, when `lastro init` runs, then no existing file changes."
    tests: []
decisions: []
questions: []
depends_on: []
touches: []
