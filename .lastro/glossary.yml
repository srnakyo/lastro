terms:
  - term: "lastro"
    means: "the backing of an item: cited origin, acceptance criteria from the requester, and evidence on the current commit"
  - term: "source"
    means: "anything that arrives from the requester: document, chat, audio, video, image, meeting"
  - term: "anchor"
    means: "the stable position of a quote inside a source (paragraph, page, message id, timestamp)"
  - term: "atomic requirement"
    means: "one verifiable behavior, with its own acceptance criteria"
  - term: "gate"
    means: "the evaluation that moves a requirement from building to verified"
  - term: "evidence"
    means: "the record of a run executed by Lastro itself: commit, command, exit code, results, artifacts"
  - term: "condition"
    means: "a reusable real-usage setting a stage must run under (profile, data volume, theme, zoom)"
  - term: "package"
    means: "one delivery round, usually one document or batch of messages from the requester"
  - term: "human command"
    means: "an action only a person may take: approve, accept, unlock, confirm a decision, sign a manual stage"
invariants:
  - id: INV-1
    text: "The gate only accepts evidence from runs executed by Lastro itself."
  - id: INV-2
    text: "No MCP tool approves, accepts, unlocks or signs a manual stage."
  - id: INV-3
    text: "In local mode the core makes no network calls and the dashboard listens on 127.0.0.1 only; in server mode Lastro talks only to the configured Postgres, bucket and server."
  - id: INV-4
    text: "Every file under .lastro/ that Lastro writes validates against the published JSON Schema."
